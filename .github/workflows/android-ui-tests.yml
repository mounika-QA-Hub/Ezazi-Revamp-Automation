# eZAZI Android UI tests on GitHub Actions
#  1. framework-check : device-free self test (fails fast on config/data mistakes, ~1 min)
#  2. android-ui-tests: boots an Android 15 tablet emulator, runs the suite, publishes Allure
#
# Required repository secrets:
#   EZAZI_APK_URL    - direct download URL of the APK under test (or replace the download step
#                      with actions/download-artifact from your app build workflow)
#   EZAZI_USERNAME / EZAZI_PASSWORD - test account (only needed for the "requires-backend" group)
name: eZAZI Android UI tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite (smoke | testng | regression)"
        default: smoke
      env:
        description: "Environment (dev | qa | uat)"
        default: qa
      variant:
        description: "App variant (variantA | variantB)"
        default: variantA
  pull_request:
  schedule:
    - cron: "30 1 * * *"   # nightly 01:30 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SUITE: ${{ github.event.inputs.suite || (github.event_name == 'schedule' && 'regression') || 'smoke' }}
  TEST_ENV: ${{ github.event.inputs.env || 'qa' }}
  VARIANT: ${{ github.event.inputs.variant || 'variantA' }}

jobs:
  framework-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Framework self-test (no device)
        run: chmod +x mvnw && ./mvnw -B test -Dsuite=framework

  android-ui-tests:
    needs: framework-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Appium + UiAutomator2 driver (pinned)
        run: |
          npm install -g appium@3.9.0
          appium driver install uiautomator2@8.7.3

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK under test
        run: |
          mkdir -p apps
          curl -fsSL "${{ secrets.EZAZI_APK_URL }}" -o "apps/ezazi-${VARIANT}.apk"

      - name: Run tests on Android 15 tablet emulator
        id: tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EZAZI_USERNAME: ${{ secrets.EZAZI_USERNAME }}
          EZAZI_PASSWORD: ${{ secrets.EZAZI_PASSWORD }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: chmod +x mvnw && ./mvnw -B test -Dsuite=${{ env.SUITE }} -Denv=${{ env.TEST_ENV }} -Dvariant=${{ env.VARIANT }} -Dmaven.test.failure.ignore=true

      - name: Generate Allure report
        if: always()
        run: ./mvnw -B allure:report

      - name: Upload Allure results, report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-${{ env.SUITE }}-${{ github.run_number }}
          path: |
            target/allure-results
            target/allure-report
            target/logs
          retention-days: 14

      - name: Publish Allure report to GitHub Pages (main branch only)
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
          destination_dir: ${{ env.SUITE }}

      - name: Fail the job if any test failed
        if: always()
        run: |
          if grep -Eq 'failures="[1-9]|errors="[1-9]' target/surefire-reports/TEST-*.xml; then
            echo "::error::Test failures - see the Allure report artifact"
            exit 1
          fi
