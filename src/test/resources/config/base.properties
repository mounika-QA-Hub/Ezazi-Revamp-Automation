# =====================================================================================
#  Framework defaults. Loaded first; overridden by env/<env>.properties,
#  variants/<variant>.properties, ./local.properties, env vars (APPIUM_PORT) and -Dkey=value.
#  NEVER put credentials here - use the .env file (see .env.example).
# =====================================================================================

# ----- Selection (override with -Denv=uat -Dvariant=variantB) -----
env=qa
variant=variantA

# ----- Appium server -----
# true = framework starts/stops a local Appium server; false = use appium.server.url
appium.server.start=true
appium.server.url=http://127.0.0.1:4723/
appium.host=127.0.0.1
# 'auto' picks a free port (no clashes with other runs / Appium Inspector)
appium.port=auto
appium.log.level=info
appium.relaxed.security=false
appium.start.timeout.seconds=60
# Optional explicit paths when auto-detection fails (Windows example):
# appium.js.path=C:/Users/<you>/AppData/Roaming/npm/node_modules/appium/build/lib/main.js
# appium.node.path=C:/Program Files/nodejs/node.exe
appium.js.path=
appium.node.path=

# ----- Devices -----
# 'auto' = every device listed by 'adb devices'; or a comma list: emulator-5554,R58N12ABCDE
device.udids=auto
device.name=Android Device
# blank = let Appium detect the Android version
device.platform.version=
# UiAutomator2 host ports: device #1 -> 8200, device #2 -> 8201 ...
device.system.port.base=8200
device.acquire.timeout.seconds=600

# ----- Emulator (optional) -----
emulator.start=false
emulator.avd=MounikaTab
emulator.headless=false
emulator.boot.timeout.seconds=240
emulator.stop.after.suite=true

# ----- App behaviour -----
app.no.reset=true
app.full.reset=false
app.auto.grant.permissions=true
# Between tests of the same session: relaunch (default, clean screen) | clear (wipe data) | none (fastest)
app.reset.strategy=relaunch
app.date.format=dd/MM/yyyy
app.time.format=hh:mm a

# ----- Driver / session -----
# class = one session per test class (fast) | method = new session per test (isolated)
driver.session.scope=class
driver.new.command.timeout.seconds=300
driver.session.create.retries=1
# true = use Appium's invisible keyboard so the soft keyboard never covers buttons (original keyboard is
# restored after the session). Set false only for tests that check the keyboard itself.
driver.hide.keyboard=true

# ----- Timeouts -----
timeout.explicit.seconds=15
timeout.short.seconds=3
timeout.app.launch.seconds=60
timeout.polling.millis=250

# ----- Parallel execution (see README) -----
# auto = one thread per connected device; or a number
parallel.threads=auto

# ----- Test data -----
testdata.excel.file=testdata/excel/ezazi-testdata.xlsx

# ----- Retry -----
retry.max.count=1
retry.on.assertion.failure=false

# ----- Reporting -----
allure.results.directory=target/allure-results
allure.clean.results=true
allure.report.generate=false
allure.report.dir=target/allure-report
report.logcat.lines=300
report.screenshot.on.success=false
